networks:
  dev:

services:
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - 5173:5173
  #   networks:
  #     - dev 

  mock_game:
    build:
      context: ./mock_game
      dockerfile: Dockerfile
    depends_on:
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALGORITHM=${ALGORITHM}
      - REDIS_HOST=${REDIS_HOST}
    ports:
      - 6767:6767
    networks:
      - dev
  lobby:
    build:
      context: ./lobby
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALGORITHM=${ALGORITHM}
      - REDIS_HOST=${REDIS_HOST}
    ports:
      - 8000:8000
    networks:
      - dev
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # CORS
      CORS_ADDRS: ${AUTH_CORS_ADDRS}

      # JWT
      SECRET_FILE: ${PRIVATE_KEY_FILE}

      # Postgres
      DB_URL: ${DATABASE_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    networks:
      - dev
  redis:
    image: redis:alpine
    ports:
      - 6379:6379
    networks:
      - dev
  db:
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/data.sql
    image: postgres:alpine
    environment:
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  db-data:
